<!doctype html>
<html lang="rw">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Kibondo prototype</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Inter:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #fdf2f8;
                --card: #ffffff;
                --ink: #3a1428;
                --mut: #7a5568;
                --pk: #be185d;
                --on-pk: #ffffff;
                --bd: #a87891;
                --ln: #f0d4e1;
                --ok: #15803d;
                --wn: #b45309;
                color-scheme: light;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    --bg: #1d1317;
                    --card: #291b21;
                    --ink: #fbeef2;
                    --mut: #cfb0bd;
                    --pk: #f472a5;
                    --on-pk: #2a0a18;
                    --bd: #8a6678;
                    --ln: #46303a;
                    --ok: #4cc79b;
                    --wn: #f0a050;
                    color-scheme: dark;
                }
            }
            :root[data-theme="dark"] {
                --bg: #1d1317;
                --card: #291b21;
                --ink: #fbeef2;
                --mut: #cfb0bd;
                --pk: #f472a5;
                --on-pk: #2a0a18;
                --bd: #8a6678;
                --ln: #46303a;
                --ok: #4cc79b;
                --wn: #f0a050;
                color-scheme: dark;
            }
            html {
                scroll-padding-top: env(safe-area-inset-top, 0px);
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font:
                    400 16px/1.45 "Inter",
                    system-ui,
                    sans-serif;
                display: grid;
                place-items: center;
                min-height: 100vh;
            }
            #app {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                scrollbar-width: none;
            }
            #app::-webkit-scrollbar {
                display: none;
            }
            .phone {
                position: relative;
                box-sizing: border-box;
                width: 396px;
                height: min(860px, calc(100vh - 24px));
                padding: 14px;
                border-radius: 60px;
                background: #0d0c10;
                border: 2px solid #34323a;
            }
            .phone::before,
            .phone::after {
                content: "";
                position: absolute;
                width: 4px;
                border-radius: 3px;
                background: #26242b;
            }
            .phone::before {
                left: -5px;
                top: 160px;
                height: 64px;
            }
            .phone::after {
                right: -5px;
                top: 210px;
                height: 96px;
            }
            .screen {
                position: relative;
                width: 100%;
                height: 100%;
                border-radius: 46px;
                overflow: hidden;
                background: var(--bg);
                transform: translateZ(0);
                display: flex;
                flex-direction: column;
            }
            .sb {
                flex: none;
                height: 50px;
                padding: 6px 28px 0;
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 15px;
                font-weight: 500;
                position: relative;
                z-index: 5;
            }
            .sb span {
                display: flex;
                gap: 6px;
                align-items: center;
            }
            .island {
                position: absolute;
                top: 11px;
                left: 50%;
                transform: translateX(-50%);
                width: 112px;
                height: 32px;
                border-radius: 20px;
                background: #000;
            }
            .island::after {
                content: "";
                position: absolute;
                right: 10px;
                top: 10px;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: #1e293b;
            }
            .hi {
                position: absolute;
                bottom: 7px;
                left: 50%;
                transform: translateX(-50%);
                width: 128px;
                height: 5px;
                border-radius: 3px;
                background: var(--ink);
                opacity: 0.45;
                z-index: 25;
                pointer-events: none;
            }
            .screen nav {
                padding-bottom: 10px;
            }
            @media (max-width: 520px) {
                body {
                    display: block;
                }
                .phone {
                    width: auto;
                    height: auto;
                    padding: 0;
                    border-radius: 0;
                    background: none;
                    border: 0;
                }
                .phone::before,
                .phone::after,
                .sb,
                .hi {
                    display: none;
                }
                .screen {
                    height: auto;
                    min-height: 100vh;
                    border-radius: 0;
                    overflow: visible;
                    transform: none;
                    display: block;
                }
                #app {
                    overflow: visible;
                    min-height: 100vh;
                    display: flex;
                    flex-direction: column;
                }
                .screen nav {
                    padding-bottom: 0;
                }
            }
            .pg {
                flex: 1;
                padding: 20px 18px 28px;
                display: flex;
                flex-direction: column;
            }
            h1,
            h2,
            h3,
            .disp {
                font-family: "Bricolage Grotesque", system-ui, sans-serif;
                font-weight: 700;
                letter-spacing: -0.02em;
            }
            h1 {
                font-size: 26px;
                line-height: 1.2;
                margin: 0 0 4px;
            }
            h2 {
                font-size: 22px;
                line-height: 1.25;
                margin: 0 0 14px;
            }
            h3 {
                font-size: 19px;
                line-height: 1.3;
                margin: 0 0 12px;
            }
            .m {
                color: var(--mut);
                font-size: 14px;
                margin: 4px 0 8px;
            }
            label.m {
                display: block;
            }
            .i {
                width: 22px;
                height: 22px;
                flex: none;
                color: var(--pk);
            }
            button {
                font-family: "Inter", system-ui, sans-serif;
            }
            .b {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                width: 100%;
                min-height: 48px;
                border: 0;
                border-radius: 8px;
                padding: 12px 16px;
                font:
                    500 16px/1.3 "Inter",
                    system-ui,
                    sans-serif;
                background: var(--pk);
                color: var(--on-pk);
                margin: 8px 0;
                cursor: pointer;
                text-align: center;
            }
            .b .i {
                color: currentColor;
            }
            .b:hover,
            .b:active {
                opacity: 0.9;
            }
            .b.o {
                background: transparent;
                color: var(--pk);
                border: 1.5px solid var(--pk);
            }
            .b.o:hover,
            .b.o:active {
                background: var(--card);
                opacity: 1;
            }
            .b:disabled {
                opacity: 0.45;
                cursor: not-allowed;
            }
            button:focus-visible,
            input:focus-visible {
                outline: 3px solid var(--pk);
                outline-offset: 2px;
            }
            .bk {
                border: 0;
                background: none;
                color: var(--pk);
                width: 44px;
                min-width: 44px;
                min-height: 44px;
                padding: 0;
                margin: 0 0 6px -10px;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                align-self: flex-start;
            }
            .lk {
                border: 0;
                background: none;
                color: var(--pk);
                font:
                    500 16px/1.3 "Inter",
                    system-ui,
                    sans-serif;
                text-decoration: underline;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                min-height: 44px;
                margin: 4px auto 0;
                padding: 8px;
            }
            .lk:hover,
            .lk:active {
                opacity: 0.8;
            }
            input {
                width: 100%;
                min-height: 48px;
                box-sizing: border-box;
                padding: 12px;
                border: 1.5px solid var(--bd);
                border-radius: 8px;
                background: var(--card);
                color: var(--ink);
                font:
                    400 16px/1.4 "Inter",
                    system-ui,
                    sans-serif;
                margin: 4px 0 10px;
            }
            input:focus {
                border-color: var(--pk);
            }
            .dt {
                display: flex;
                gap: 8px;
            }
            .dt input {
                text-align: center;
                flex: 1;
                min-width: 0;
                width: auto;
            }
            .dt input:last-child {
                flex: 1.8;
            }
            .seg {
                display: inline-flex;
                border: 1.5px solid var(--pk);
                border-radius: 8px;
                overflow: hidden;
                background: var(--card);
            }
            .seg.eq {
                display: flex;
                width: 100%;
                margin: 0 0 14px;
            }
            .seg button {
                border: 0;
                background: transparent;
                color: var(--pk);
                min-height: 44px;
                padding: 8px 12px;
                font:
                    500 14px/1.25 "Inter",
                    system-ui,
                    sans-serif;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
            }
            .seg button + button {
                border-left: 1.5px solid var(--pk);
            }
            .seg.eq button {
                flex: 1;
                min-width: 0;
            }
            .seg button.on {
                background: var(--pk);
                color: var(--on-pk);
            }
            .seg button:not(.on):hover {
                opacity: 0.82;
            }
            .stp {
                height: 4px;
                background: var(--ln);
                border-radius: 4px;
                overflow: hidden;
                margin: 0 0 14px;
            }
            .stp i {
                display: block;
                height: 100%;
                background: var(--pk);
            }
            .w-wrap {
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                gap: 20px;
            }
            .w-top {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
            }
            .wm {
                display: flex;
                align-items: center;
                gap: 8px;
                font-family: "Bricolage Grotesque", system-ui, sans-serif;
                font-weight: 700;
                font-size: 20px;
                color: var(--ink);
            }
            .wm .i {
                width: 24px;
                height: 24px;
                color: var(--pk);
            }
            .av {
                width: 44px;
                height: 44px;
                border-radius: 8px;
                border: 1.5px solid var(--bd);
                background: var(--card);
                color: var(--pk);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 4px;
                padding: 0;
                cursor: pointer;
                flex: none;
                font:
                    700 15px/1 "Bricolage Grotesque",
                    system-ui,
                    sans-serif;
            }
            .av .i {
                width: 20px;
                height: 20px;
                color: currentColor;
            }
            .av:hover,
            .av:active {
                opacity: 0.88;
            }
            .hhdr .av {
                border-color: rgba(255, 255, 255, 0.45);
                background: rgba(255, 255, 255, 0.14);
                color: var(--on-pk);
            }
            :root[data-theme="dark"] .hhdr .av {
                border-color: rgba(42, 10, 24, 0.35);
                background: rgba(42, 10, 24, 0.14);
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) .hhdr .av {
                    border-color: rgba(42, 10, 24, 0.35);
                    background: rgba(42, 10, 24, 0.14);
                }
            }
            .big1000 {
                font-family: "Bricolage Grotesque", system-ui, sans-serif;
                font-weight: 700;
                font-size: 108px;
                line-height: 0.95;
                color: var(--pk);
                margin: 20px 0 8px;
                letter-spacing: -0.04em;
            }
            .w-h1 {
                font-size: 23px;
                line-height: 1.25;
                margin: 0 0 18px;
            }
            .tl {
                margin: 0 0 18px;
            }
            .tl-bar {
                display: flex;
                gap: 4px;
                height: 10px;
            }
            .tl-bar span {
                display: block;
                height: 100%;
                border-radius: 2px;
                background: var(--pk);
            }
            .tl-bar span:nth-child(2) {
                opacity: 0.55;
            }
            .tl-bar span:nth-child(3) {
                opacity: 0.25;
            }
            .tl-lbl {
                display: flex;
                gap: 4px;
                margin-top: 6px;
                font-size: 13px;
                color: var(--mut);
            }
            .tl-lbl span {
                min-width: 0;
            }
            .rows {
                border-top: 1px solid var(--ln);
                border-bottom: 1px solid var(--ln);
            }
            .row {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 12px 0;
                min-height: 44px;
                box-sizing: border-box;
            }
            .row + .row {
                border-top: 1px solid var(--ln);
            }
            .row > div {
                flex: 1;
                min-width: 0;
            }
            .grp {
                background: var(--card);
                border: 1px solid var(--ln);
                border-radius: 8px;
                overflow: hidden;
                margin: 0 0 14px;
            }
            .grow {
                display: flex;
                align-items: center;
                gap: 12px;
                width: 100%;
                min-height: 56px;
                padding: 12px 14px;
                box-sizing: border-box;
                border: 0;
                background: transparent;
                color: var(--ink);
                font:
                    400 16px/1.4 "Inter",
                    system-ui,
                    sans-serif;
                text-align: left;
                cursor: pointer;
            }
            .grow.static {
                cursor: default;
            }
            .grow + .grow {
                border-top: 1px solid var(--ln);
            }
            button.grow:hover,
            button.grow:active {
                background: var(--bg);
            }
            .grow > div {
                flex: 1;
                min-width: 0;
            }
            .grow b {
                font-weight: 500;
                display: block;
            }
            .sub {
                color: var(--mut);
                font-size: 13px;
                margin-top: 2px;
            }
            .st {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                font-size: 13px;
                font-weight: 500;
                color: var(--pk);
                flex: none;
                white-space: nowrap;
                padding: 3px 6px;
                border-radius: 4px;
            }
            .st i {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: currentColor;
                flex: none;
            }
            .st.ok {
                color: var(--ok);
            }
            .st.wn {
                color: var(--wn);
            }
            .hhdr {
                background: var(--pk);
                color: var(--on-pk);
                padding: 16px 18px 18px;
            }
            .hhdr-top {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin: 0 0 6px;
            }
            .hhdr .gr {
                font-size: 14px;
                opacity: 0.92;
                margin: 0;
            }
            .hhdr .ht {
                font-family: "Bricolage Grotesque", system-ui, sans-serif;
                font-weight: 700;
                font-size: 30px;
                line-height: 1.15;
                margin: 0;
            }
            .hhdr .hd {
                font-size: 14px;
                opacity: 0.92;
                margin: 6px 0 0;
            }
            .hbar {
                height: 5px;
                background: rgba(255, 255, 255, 0.28);
                border-radius: 4px;
                overflow: hidden;
                margin-top: 12px;
            }
            .hbar i {
                display: block;
                height: 100%;
                background: var(--on-pk);
            }
            :root[data-theme="dark"] .hbar {
                background: rgba(42, 10, 24, 0.25);
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) .hbar {
                    background: rgba(42, 10, 24, 0.25);
                }
            }
            .tipblk {
                border-top: 1px solid var(--ln);
                padding: 14px 0 6px;
                margin: 6px 0 10px;
            }
            .tipblk b {
                display: block;
                font-weight: 500;
                margin-bottom: 4px;
            }
            .chk {
                display: flex;
                align-items: center;
                gap: 12px;
                width: 100%;
                min-height: 56px;
                padding: 12px 14px;
                box-sizing: border-box;
                cursor: pointer;
            }
            .chk + .chk {
                border-top: 1px solid var(--ln);
            }
            .chk input {
                width: 22px;
                height: 22px;
                min-height: 22px;
                margin: 0;
                flex: none;
                accent-color: var(--pk);
            }
            .er {
                color: var(--wn);
                font-size: 14px;
                margin: 0 0 8px;
            }
            nav {
                position: sticky;
                bottom: 0;
                display: flex;
                min-height: 56px;
                background: var(--card);
                border-top: 1px solid var(--ln);
            }
            nav button {
                flex: 1;
                min-width: 0;
                min-height: 56px;
                border: 0;
                border-top: 2px solid transparent;
                background: none;
                color: var(--mut);
                padding: 6px 2px 8px;
                font:
                    500 13px/1.2 "Inter",
                    system-ui,
                    sans-serif;
                display: grid;
                justify-items: center;
                align-content: center;
                gap: 3px;
                cursor: pointer;
            }
            nav button .i {
                width: 20px;
                height: 20px;
                color: currentColor;
            }
            nav button.on {
                color: var(--pk);
                border-top-color: var(--pk);
            }
            nav button:hover {
                color: var(--pk);
            }
            .sheet {
                display: none;
                position: fixed;
                inset: 0;
                z-index: 20;
            }
            .sheet.on {
                display: block;
            }
            .ov {
                position: absolute;
                inset: 0;
                background: rgba(20, 6, 14, 0.5);
            }
            .pn {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                max-width: 430px;
                margin: auto;
                background: var(--card);
                border-top: 1px solid var(--ln);
                border-radius: 12px 12px 0 0;
                padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px));
                max-height: 88%;
                overflow: auto;
            }
            .mi {
                border-top: 1px solid var(--ln);
                border-bottom: 1px solid var(--ln);
                margin: 0 0 14px;
            }
            .mi-r {
                display: grid;
                grid-template-columns: minmax(108px, 36%) 1fr;
                gap: 10px;
                padding: 10px 0;
                font-size: 14px;
                line-height: 1.45;
            }
            .mi-r + .mi-r {
                border-top: 1px solid var(--ln);
            }
            .mi-r b {
                font-weight: 500;
                color: var(--mut);
            }
            #toast {
                position: fixed;
                left: 50%;
                bottom: calc(90px + env(safe-area-inset-bottom, 0px));
                transform: translateX(-50%);
                background: var(--ink);
                color: var(--bg);
                padding: 10px 16px;
                border-radius: 8px;
                font-size: 14px;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s;
                max-width: 88%;
                text-align: center;
                z-index: 30;
            }
            #toast.on {
                opacity: 1;
            }
            .pg.in {
                animation: pin 0.28s cubic-bezier(0.2, 0.7, 0.3, 1);
            }
            @keyframes pin {
                from {
                    opacity: 0;
                    transform: translateY(12px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }
            @keyframes fd {
                from {
                    opacity: 0;
                }
            }
            @keyframes up {
                from {
                    transform: translateY(100%);
                }
            }
            .b,
            .grow,
            nav button,
            input,
            .seg button,
            .av {
                transition:
                    background-color 0.18s,
                    border-color 0.18s,
                    color 0.18s,
                    opacity 0.18s;
            }
            .sheet.on .ov {
                animation: fd 0.25s;
            }
            .sheet.on .pn {
                animation: up 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
            }
            .sheet.stay .ov,
            .sheet.stay .pn {
                animation: none;
            }
            .sheet.out .ov {
                opacity: 0;
                transition: opacity 0.2s;
            }
            .sheet.out .pn {
                transform: translateY(100%);
                transition: transform 0.2s;
            }
            @media (prefers-reduced-motion: reduce) {
                * {
                    animation: none !important;
                    transition: none !important;
                }
            }
        </style>
    </head>
    <body>
        <div class="phone">
            <div class="screen">
                <div class="sb">
                    <span id="clk">9:41</span>
                    <div class="island"></div>
                    <span
                        ><svg
                            width="18"
                            height="12"
                            viewBox="0 0 18 12"
                            fill="currentColor"
                            aria-hidden="true"
                        >
                            <rect x="0" y="8" width="3" height="4" rx="1" />
                            <rect x="5" y="5" width="3" height="7" rx="1" />
                            <rect x="10" y="2" width="3" height="10" rx="1" />
                            <rect
                                x="15"
                                y="0"
                                width="3"
                                height="12"
                                rx="1"
                            /></svg
                        ><svg
                            width="16"
                            height="12"
                            viewBox="0 0 16 12"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.6"
                            stroke-linecap="round"
                            aria-hidden="true"
                        >
                            <path
                                d="M1 4.5a10 10 0 0 1 14 0M3.5 7.2a6.5 6.5 0 0 1 9 0"
                            />
                            <circle
                                cx="8"
                                cy="10"
                                r="1"
                                fill="currentColor"
                                stroke="none"
                            /></svg
                        ><svg
                            width="26"
                            height="12"
                            viewBox="0 0 26 12"
                            fill="none"
                            stroke="currentColor"
                            aria-hidden="true"
                        >
                            <rect
                                x=".5"
                                y=".5"
                                width="22"
                                height="11"
                                rx="3.5"
                            />
                            <rect
                                x="2.5"
                                y="2.5"
                                width="16"
                                height="7"

                            return d.done
                                ? `<div class="grow static">${body}</div>`
                                : `<button type="button" class="grow" onclick="act('${r}')">${body}</button>`;
                        })
                        .join(
                            "",
                        )}</div><p class="m">${t("Sample content from a schedule chart. The real Rwanda schedule must come from doctors.")}</p>`,
                );
            }

            function fAppt() {
                tab = "appt";
                const ap = [...(U.appts || [])].sort(
                    (a, b) =>
                        (a.done ? 1 : 0) - (b.done ? 1 : 0) || a.due - b.due,
                );
                let rows = "";
                if (U.preg) {
                    const a = U.appt,
                        t0 = td();
                    rows += a
                        ? `<button type="button" class="grow" onclick="act('a')">${I("cal")}<div><b>${t("Antenatal visit")}</b><div class="sub">${fm(a.due)}, ${a.src == "doctor" ? t("from your card") : t("estimated by Kibondo")}</div></div>${a.due < t0 ? stHtml(t("Did you go?"), "wn") : ""}</button>`
                        : `<div class="grow static">${I("cal")}<div><b>${t("Antenatal visit")}</b><div class="sub">${t("No more visits in the schedule.")}</div></div></div>`;
                }
                ap.forEach((c) => {
                    const [sl, sc] = stc(c),
                        body = `${I("cal")}<div><b>${c.title ? E(c.title) : t("Clinic visit")}</b><div class="sub">${c.who ? E(c.who) + ", " : ""}${c.done ? (c.given ? t("Given {0}", fm(c.given)) : t("Done")) : fm(c.due)}</div></div>${stHtml(sl, sc)}`;
                    rows += c.done
                        ? `<div class="grow static">${body}</div>`
                        : `<button type="button" class="grow" onclick="act('c:${c.id}')">${body}</button>`;
                });
                main(
                    `${topHdr(t("Appointments"))}<button type="button" class="b" style="margin-top:0;margin-bottom:14px" onclick="newAppt()">${I("plus")}${t("Add appointment")}</button>${rows ? `<div class="grp">${rows}</div>` : `<div class="grp"><div class="grow static"><div><b>${t("No appointments yet.")}</b><div class="sub">${t("Add a doctor or clinic appointment date from your card.")}</div></div></div></div>`}`,
                );
            }

            function newAppt() {
                const whos = [
                    ...(U.preg ? [t("Mother")] : []),
                    ...(U.kids || []).map((k) => k.name),
                ];
                T.aw = whos[0] || "";
                sheet(
                    `<h3>${t("Add appointment")}</h3>${whos.length > 1 ? `<label class="m">${t("For whom")}</label><div class="seg eq" id="awg" role="group">${whos.map((w, i) => `<button type="button" class="${i == 0 ? "on" : ""}" onclick="T.aw=this.textContent;[...this.parentNode.children].forEach(b=>b.classList.toggle('on',b===this))">${w}</button>`).join("")}</div>` : ""}<label class="m" for="at">${t("Reason (optional)")}</label><input id="at" maxlength="40" placeholder="${t("e.g. Weight check, checkup")}"><label class="m">${t("Appointment date")}</label>${DB("ad")}<p id="er" class="er"></p><button type="button" class="b" onclick="svAppt()">${t("Save")}</button><button type="button" class="b o" onclick="cs()">${t("Cancel")}</button>`,
                );
            }
            function svAppt() {
                const d = RD("ad");
                if (d === null || isNaN(d) || d < td())
                    return ($("#er").textContent = dErr(d));
                const title = $("#at").value.trim();
                if (!U.appts) U.appts = [];
                U.appts.push({
                    id: String(Date.now()),
                    who: T.aw,
                    title: title,
                    due: d,
                    src: "doctor",
                });
                sv();
                cs();
                still = 1;
                go();
                toast(t("Saved"));
            }
            function delAppt(id) {
                U.appts = (U.appts || []).filter((c) => c.id !== id);
                sv();
                cs();
                still = 1;
                go();
                toast(t("Appointment removed"));
            }

            function fTips() {
                tab = "tips";
                const l = tipsFor();
                main(
                    `${topHdr(t("Tips"))}<div class="rows">${l.length ? l.map((x) => `<div class="row">${I("bulb")}<div>${x}</div></div>`).join("") : `<div class="row"><div>${t("No approved tip for this stage yet.")}</div></div>`}</div><p class="m" style="margin-top:12px">${t("Sample text for the prototype. Real tips are written or approved by doctors, in Kinyarwanda.")}</p>`,
                );
            }

            function fMe() {
                tab = "me";
                main(
                    `<button type="button" class="bk" onclick="go('home')" aria-label="${t("Back")}">${I("back")}</button><div class="w-top" style="margin-bottom:14px"><h2 style="margin:0">${t("Profile")}</h2>${langSw()}</div><div class="rows" style="margin-bottom:16px"><div class="row">${I("phone")}<div><b style="font-weight:500">${ph}</b><div class="sub">${t("Protected by your PIN")}</div></div></div></div><button type="button" class="b o" onclick="U=null;ph=null;go('welcome')">${t("Log out")}</button><button type="button" class="b o" onclick="rq()">${t("Reset prototype data")}</button><p class="m" style="margin-top:12px">${t("Prototype only. There is no server: data stays on this device, and no SMS is sent.")}</p>`,
                );
            }
            function rq() {
                sheet(
                    `<h3>${t("Remove all prototype data?")}</h3><button type="button" class="b" onclick="rs()">${t("Yes, remove")}</button><button type="button" class="b o" onclick="cs()">${t("Cancel")}</button>`,
                );
            }
            function rs() {
                S = { acc: {}, lang: lang };
                sv();
                U = null;
                ph = null;
                cs();
                go("welcome");
            }

            const tt = (r) =>
                r == "a"
                    ? t("Antenatal visit")
                    : r[0] == "c"
                      ? tg(r).title
                          ? E(tg(r).title)
                          : t("Clinic visit")
                      : t(tg(r).n);
            const tg = (r) => {
                if (r == "a") return U.appt;
                const p = r.split(":");
                if (r[0] == "c")
                    return (U.appts || []).find((x) => x.id === p[1]);
                return r[0] == "m" ? U.tt[p[1]] : U.kids[p[1]].doses[p[2]];
            };
            const mi = (r) => {
                const m = M(tg(r).id);
                return `<div class="mi"><div class="mi-r"><b>${t("Protects against:")}</b><span>${t(m[3])}</span></div><div class="mi-r"><b>${t("When:")}</b><span>${t(m[4])}</span></div><div class="mi-r"><b>${t("Dose:")}</b><span>${t(m[5])}</span></div><div class="mi-r"><b>${t("Route:")}</b><span>${t(m[6])}</span></div><div class="mi-r"><b>${t("Site:")}</b><span>${t(m[7])}</span></div></div>`;
            };
            function act(r) {
                const c = r[0] == "c" ? tg(r) : null;
                sheet(
                    `<h3>${tt(r)}</h3>${r == "a" ? `<p class="m">${U.appt.src == "doctor" ? t("This date came from your clinic card.") : t("Kibondo estimated this date from your pregnancy weeks. Ask your clinic to confirm it.")}</p>` : c ? `<p class="m">${c.who ? E(c.who) + " · " : ""}${fm(c.due)}</p>` : mi(r)}<button type="button" class="b" onclick="wt('${r}')">${I("check")}${t("I went")}</button><button type="button" class="b o" onclick="ms('${r}')">${I("x")}${t("I missed it")}</button><button type="button" class="b o" onclick="ch('${r}')">${I("edit")}${t("Change date")}</button>${c ? `<button type="button" class="b o" onclick="delAppt('${c.id}')">${t("Remove appointment")}</button>` : ""}`,
                );
            }
            function wt(r) {
                const a = r == "a" || r[0] == "c";
                sheet(
                    `<h3>${a ? t("Next date on your card?") : t("Date the dose was given")}</h3>${DB("x")}${a ? "" : `<p class="m">${t("Next date from the card (optional)")}</p>` + DB("n")}<p id="er" class="er"></p><button type="button" class="b" onclick="wd('${r}')">${t("Save")}</button>${a ? `<button type="button" class="b o" onclick="wd('${r}',1)">${t("No next date")}</button>` : ""}`,
                );
            }
            function wd(r, s) {
                const e = $("#er"),
                    a = r == "a",
                    c = r[0] == "c",
                    x = RD("x"),
                    t0 = td();
                if (a) {
                    if (!s && (x === null || isNaN(x) || x < t0))
                        return (e.textContent = dErr(x));
                    U.ai++;
                    U.appt = s ? nextAnc() : { due: x, src: "doctor" };
                } else if (c) {
                    if (!s && (x === null || isNaN(x) || x < t0))
                        return (e.textContent = dErr(x));
                    const u = tg(r);
                    u.done = true;
                    u.given = t0;
                    if (!s)
                        U.appts.push({
                            id: String(Date.now()),
                            who: u.who,
                            title: u.title,
                            due: x,
                            src: "doctor",
                        });
                } else {
                    const d = tg(r),
                        n = RD("n");
                    if (x === null || isNaN(x) || x > t0)
                        return (e.textContent =
                            x === null
                                ? t("Type the date the dose was given.")
                                : isNaN(x)
                                  ? dErr(x)
                                  : t(
                                        "The date given cannot be in the future.",
                                    ));
                    if (isNaN(n) || (n !== null && n < t0))
                        return (e.textContent = dErr(n));
                    d.done = true;
                    d.given = x;
                    lst(r).forEach((o) => {
                        if (o.p == d.id && !o.done) {
                            if (n) {
                                o.due = n;
                                o.src = "doctor";
                            } else if (o.src != "doctor")
                                o.due = Math.max(o.due, x + o.g * D);
                        }
                    });
                }
                sv();
                cs();
                still = 1;
                go();
                toast(t("Saved"));
            }
            function ms(r) {
                sheet(
                    `<h3>${t("When is your new appointment?")}</h3>${DB("x")}<p id="er" class="er"></p><button type="button" class="b" onclick="sd('${r}')">${t("Save")}</button><button type="button" class="b o" onclick="cs();toast('${t("Please go to your health center and ask for a new date.")}')">${t("I don’t know yet")}</button>`,
                );
            }
            function ch(r) {
                sheet(
                    `<h3>${t("New date from the doctor")}</h3>${DB("x")}<p id="er" class="er"></p><button type="button" class="b" onclick="sd('${r}')">${t("Save")}</button>`,
                );
            }
            function sd(r) {
                const x = RD("x");
                if (x === null || isNaN(x) || x < td())
                    return ($("#er").textContent = dErr(x));
                const u = tg(r);
                u.due = x;
                u.src = "doctor";
                sv();
                cs();
                still = 1;
                go();
                toast(t("New date saved"));
            }
            const clk = () => {
                const d = new Date();
                $("#clk").textContent =
                    d.getHours() +
                    ":" +
                    String(d.getMinutes()).padStart(2, "0");
            };
            clk();
            setInterval(clk, 30000);
            go("welcome");
        </script>
    </body>
</html>
